<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 NeonMedia</title>
    <style>
        :root { --bg:#0a0f0a;--bg2:#111a11;--text:#c8e6c8;--text2:#8fbc8f;--accent:#3adb3a;--accent2:#2a8a2a;--border:#2a3a2a;--input:#152015;--radius:14px; }
        * { margin:0;padding:0;box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100vh;width:100vw;display:flex;flex-direction:column;overflow:hidden;position:fixed; }
        .header { background:var(--bg2);padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0; }
        .header h1 { font-size:18px;color:var(--accent);text-align:center;margin-bottom:8px; }
        .search-row { display:flex;gap:6px; }
        .search-row input { flex:1;padding:10px 14px;border-radius:24px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:13px;outline:none; }
        .search-row input:focus { border-color:var(--accent); }
        .search-row button { padding:10px 14px;border-radius:24px;border:none;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-size:13px; }
        .results { flex:1;overflow-y:auto;padding:10px 14px;display:none; }
        .results.active { display:block; }
        .video-card { display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start; }
        .video-card img { width:120px;height:68px;border-radius:8px;object-fit:cover;flex-shrink:0; }
        .video-card .info { flex:1;min-width:0; }
        .video-card .title { font-size:13px;font-weight:600;margin-bottom:4px; }
        .video-card .channel { font-size:11px;color:var(--text2); }
        .player-full { position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:100;display:none;flex-direction:column; }
        .player-full.active { display:flex; }
        .player-top { padding:10px 14px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.8);flex-shrink:0; }
        .player-top .close-btn { background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer; }
        .player-top .vid-title { flex:1;font-size:12px;color:#fff; }
        .player-wrap { flex:1; }
        .player-wrap iframe { width:100%;height:100%;border:none; }
        .loading { text-align:center;padding:30px;color:var(--text2); }
        .load-more { display:block;margin:12px auto;padding:10px 20px;border-radius:20px;border:none;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 NeonMedia</h1>
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="🔍 Поиск видео..." onkeypress="if(event.key==='Enter')search()">
            <button onclick="search()">🔍</button>
        </div>
    </div>
    <div class="results" id="results">
        <div class="video-grid" id="videoGrid"></div>
        <button class="load-more" id="loadMore" style="display:none;" onclick="loadMore()">📥 Ещё</button>
    </div>
    <div class="player-full" id="playerFull">
        <div class="player-top">
            <button class="close-btn" onclick="closePlayer()">✕</button>
            <div class="vid-title" id="vidTitle"></div>
        </div>
        <div class="player-wrap" id="playerWrap"></div>
    </div>
    <script>
        var API_KEY="AIzaSyAREyCW4pVYsM59LQorFKP5P8kpiQdcjWs";
        var PROXY_URL="https://neonvpn.onrender.com/proxy?url=";
        var currentQuery="",nextPageToken="";

        function search(){
            currentQuery=document.getElementById('searchInput').value.trim();
            nextPageToken="";
            document.getElementById('results').classList.add('active');
            document.getElementById('videoGrid').innerHTML='<div class="loading">⏳ Поиск...</div>';
            document.getElementById('loadMore').style.display='none';
            currentQuery?fetchSearch(""):fetchTrending("");
        }

        function fetchTrending(token){
            var url="https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=US&maxResults=20&key="+API_KEY;
            if(token)url+="&pageToken="+token;
            fetch(url).then(function(r){return r.json();}).then(function(d){renderVideos(d,false);}).catch(function(){document.getElementById('videoGrid').innerHTML='<div class="loading">❌ Ошибка</div>';});
        }

        function fetchSearch(token){
            var url="https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q="+encodeURIComponent(currentQuery)+"&type=video&key="+API_KEY;
            if(token)url+="&pageToken="+token;
            fetch(url).then(function(r){return r.json();}).then(function(d){renderVideos(d,true);}).catch(function(){document.getElementById('videoGrid').innerHTML='<div class="loading">❌ Ошибка</div>';});
        }

        function renderVideos(data,isSearch){
            nextPageToken=data.nextPageToken||"";
            var grid=document.getElementById('videoGrid');
            var html=grid.innerHTML.includes('⏳')?'':grid.innerHTML;
            if(data.items){
                data.items.forEach(function(item){
                    var s=item.snippet;
                    var id=isSearch?item.id.videoId:item.id;
                    html+='<div class="video-card" onclick="playVideo(\''+id+'\',\''+esc(s.title)+'\')"><img src="'+s.thumbnails.medium.url+'"><div class="info"><div class="title">'+s.title+'</div><div class="channel">'+s.channelTitle+'</div></div></div>';
                });
            }
            grid.innerHTML=html||'<div class="loading">😔 Ничего не найдено</div>';
            document.getElementById('loadMore').style.display=nextPageToken?'block':'none';
        }

        function loadMore(){
            document.getElementById('loadMore').style.display='none';
            currentQuery?fetchSearch(nextPageToken):fetchTrending(nextPageToken);
        }

        function playVideo(id,title){
            document.getElementById('playerFull').classList.add('active');
            document.getElementById('vidTitle').textContent=title;
            var ytUrl='https://www.youtube.com/embed/'+id+'?autoplay=1';
            document.getElementById('playerWrap').innerHTML='<iframe src="'+PROXY_URL+encodeURIComponent(ytUrl)+'" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
        }

        function closePlayer(){
            document.getElementById('playerFull').classList.remove('active');
            document.getElementById('playerWrap').innerHTML='';
        }

        function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

        document.addEventListener('keydown',function(e){if(e.key==='Escape')closePlayer();});
        search();
    </script>
</body>
</html>
